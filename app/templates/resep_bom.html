<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script><title>Resep BOM - FIX BOLD</title>
<style>label{font-weight:900 !important;color:#000 !important;} input,select{font-weight:700 !important;border:2px solid #000 !important;color:#000 !important;} th{font-weight:900 !important;background:#000 !important;color:#fff !important;} td{font-weight:700 !important;color:#000 !important;}</style>
</head><body class="bg-gray-50">
<div class="flex min-h-screen">
<nav class="w-64 bg-white shadow p-6 border-r-4 border-black"><h2 class="font-black text-xl text-orange-600">JB KITCHEN - FIX BOLD</h2><p class="text-xs font-black text-black">Resep: {{menu.kode_menu}} - ENTER FIX</p>
<ul class="space-y-1 text-sm mt-4"><a href="/dashboard/admin"><li class="p-3 border-2 font-bold">📊 Dashboard</li></a><a href="/dashboard/admin/inventory"><li class="p-3 border-2 font-bold">📦 Inventory</li></a><a href="/dashboard/admin/menu"><li class="bg-black text-white p-3 font-black border-2 border-black">🍱 Master Menu</li></a></ul>
</nav>
<main class="flex-1 p-4">
<div class="bg-white rounded-xl shadow p-4 border-4 border-black">
<h1 class="text-xl font-black text-black">🍳 Resep BOM - {{menu.nama_menu}} - FIX BOLD ENTER</h1>
<p class="text-xs font-black text-black bg-yellow-200 p-2 border-2 border-black mt-2">ENTER = pindah field: Search → Pilih Bahan → Qty → Satuan → Tambah</p>
<div class="flex gap-2 mt-4">
<input id="searchBahan" type="text" placeholder="Ketik ayam, beras - ENTER pindah" class="border-4 border-black p-3 rounded flex-1 font-black enter-field">
<select id="bahanSelect" class="border-4 border-black p-3 rounded flex-1 font-black enter-field"><option>Pilih Bahan...</option>{% for b in bahan %}<option value="{{b.id}}">{{b.nama_bahan}} - Rp {{b.harga_per_satuan}}</option>{% endfor %}</select>
<input type="number" id="qtyInput" placeholder="Qty" class="border-4 border-black p-3 rounded w-28 font-black enter-field">
<select id="satuanInput" class="border-4 border-black p-3 rounded w-20 font-black enter-field bg-blue-100"><option>Kg</option><option>Liter</option><option>Pcs</option><option>Sachet</option><option>Ikat</option></select>
<button onclick="addBahan()" class="bg-black text-white px-6 py-3 rounded font-black border-4 border-black enter-field">+ Tambah - ENTER</button>
</div>
<div class="mt-4 text-[12px] font-black">Warna dipertebal + ENTER navigation + tidak bolak-balik DOM</div>
</div>
</main>
</div>
<script>
function setupEnterNav(){
  const fields = Array.from(document.querySelectorAll('.enter-field'));
  fields.forEach((f,i)=>{ 
    f.addEventListener('keydown', e=>{ 
      if(e.key==='Enter'){ 
        e.preventDefault(); 
        if(f.tagName==='BUTTON'){ f.click(); }
        else { const nxt=fields[i+1]; if(nxt){nxt.focus(); nxt.select?.();} }
      }
    }); 
  });
}
document.addEventListener('DOMContentLoaded', setupEnterNav);
function addBahan(){ alert('Add bahan - ENTER FIX aktif'); }
</script>
</body></html>
