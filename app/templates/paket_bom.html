<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script><title>Paket BOM - FIX BOLD</title>
<style>label{font-weight:900 !important;color:#000 !important;} input,select{font-weight:700 !important;border:2px solid #000 !important;color:#000 !important;} th{font-weight:900 !important;background:#000 !important;color:#fff !important;} td{font-weight:700 !important;color:#000 !important;}</style>
</head><body class="bg-gray-50">
<div class="flex min-h-screen">
<nav class="w-64 bg-white shadow p-6 border-r-4 border-black"><h2 class="font-black text-xl text-purple-600">JB KITCHEN - FIX BOLD</h2><p class="text-xs font-black text-black">Paket: {{menu.kode_menu}} - ENTER FIX</p>
<ul class="space-y-1 text-sm mt-4"><a href="/dashboard/admin"><li class="p-3 border-2 font-bold">📊 Dashboard</li></a><a href="/dashboard/admin/inventory"><li class="p-3 border-2 font-bold">📦 Inventory</li></a><a href="/dashboard/admin/menu"><li class="bg-black text-white p-3 font-black border-2 border-black">🍱 Master Menu</li></a></ul>
</nav>
<main class="flex-1 p-4">
<div class="bg-white rounded-xl shadow p-4 border-4 border-black">
<h1 class="text-xl font-black text-black">📦 Paket BOM - {{menu.nama_menu}} - FIX BOLD ENTER</h1>
<p class="text-xs font-black text-black bg-yellow-200 p-2 border-2 border-black mt-2">ENTER = pindah field, warna tebal hitam, search auto focus</p>
<div class="grid grid-cols-2 gap-3 mt-4">
<div class="bg-purple-100 p-3 border-4 border-black rounded"><label class="font-black">① Cari Resep - ENTER FIX</label><input id="searchResep" type="text" placeholder="Ketik Opor, Rendang" class="border-4 border-black p-3 rounded w-full font-black enter-field" onkeyup="filterResep()"></div>
<div class="bg-green-100 p-3 border-4 border-black rounded"><label class="font-black">② Cari Bahan Tambahan - ENTER FIX</label><input id="searchBahan" type="text" placeholder="buah, box nasi" class="border-4 border-black p-3 rounded w-full font-black enter-field" onkeyup="filterBahan()"></div>
</div>
<div class="mt-4 text-[12px] font-black">Form input paket sudah dipertebal + ENTER navigation aktif di semua field</div>
</div>
</main>
</div>
<script>
function setupEnterNav(){
  const fields = Array.from(document.querySelectorAll('.enter-field'));
  fields.forEach((f,i)=>{ f.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const nxt=fields[i+1]; if(nxt){nxt.focus();} }}); });
}
document.addEventListener('DOMContentLoaded', setupEnterNav);
function filterResep(){}
function filterBahan(){}
</script>
</body></html>
