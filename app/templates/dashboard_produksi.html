
<!DOCTYPE html><html><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50 p-6">
<h1 class="text-2xl font-bold">Dashboard Produksi</h1><p class="mb-4">Role: {{role}} - Pesanan Masuk / Draft / Proses Produksi / Packing</p>
<div class="grid grid-cols-4 gap-4">
<div class="bg-yellow-100 p-4 rounded-xl"><h3>Pesanan Masuk</h3><p class="text-2xl">{{orders|length}}</p></div>
<div class="bg-gray-100 p-4 rounded-xl"><h3>Draft</h3><p class="text-2xl">0</p></div>
<div class="bg-blue-100 p-4 rounded-xl"><h3>Proses Produksi</h3><p class="text-2xl">2</p></div>
<div class="bg-green-100 p-4 rounded-xl"><h3>Packing</h3><p class="text-2xl">1</p></div>
</div>
<div class="mt-6 bg-white p-4 rounded-xl shadow">
<table class="w-full text-sm"><tr><th>Kode Order</th><th>Status</th><th>Aksi</th></tr>
{% for o in orders %}<tr class="border-t"><td>{{o.kode_order}}</td><td>{{o.status}}</td><td><button class="bg-blue-600 text-white px-2 py-1 rounded">Proses</button></td></tr>{% endfor %}
</table></div></body></html>
